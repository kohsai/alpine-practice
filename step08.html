<!doctype html>
<html lang="ja">
    <head>
    <meta charset="UTF-8" />
    <title>Alpine.js Step08</title>
    <script
        defer
        src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <style></style>
    </head>

    <body>
    <div x-data="{ open: false }">
        <button @click="open = true; $nextTick(() => $refs.input.focus())">
        開く
        </button>

        <div x-show="open">
        <input x-ref="input" type="text" placeholder="入力してください" />
        <button @click="open = false">閉じる</button>
        </div>
    </div>
    </body>
</html>
