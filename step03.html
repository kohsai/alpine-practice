<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>Alpine.js Step03</title>
    <script
    defer
    src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <style>
    .btn-active {
        background: blue;
        color: white;
    }

    .btn-disabled {
        background: gray;
        color: white;
    }
    </style>
</head>

<body>
    <div x-data="{ isDisabled: false }">
    <button
        @click="isDisabled = true"
        :disabled="isDisabled"
        :class="isDisabled ? 'btn-disabled' : 'btn-active'"
    >
        送信
    </button>
    </div>
</body>
</html>
