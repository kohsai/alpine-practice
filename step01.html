<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Alpine.js Step01</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body>
    <div x-data="{ count: 0 }">
        <p x-text="count"></p>
        <button x-on:click="count++">増やす</button>
        <button x-on:click="count--">減らす</button>
    </div>
</body>
</html>
